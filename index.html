<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body>
  <div class="header">Neal A Sınıfı</div>
  <div id="password-screen" class="screen-container visible">
    <p>Ana şifreyi girin:</p>
    <input type="password" id="mainPassword" placeholder="Şifre">
    <button onclick="window.checkMainPassword()">Giriş</button>
  </div>
  <div id="user-login" class="screen-container">
    <p>Kullanıcı Seç:</p>
    <select id="userSelect">
      <option value="Baran">Baran</option>
      <option value="Miraç">Miraç</option>
      <!-- Daha fazla kullanıcı eklenebilir -->
    </select>
    <input type="password" id="userPassword" placeholder="Şifre (eğer varsa)">
    <button onclick="window.checkUserLogin()">Giriş Yap</button>
  </div>
  <div id="chat" class="screen-container">
    <div class="chat-box" id="chatBox"></div>
    <div id="typingIndicator" class="typing-indicator"></div>
    <div id="replyingTo">
      <span>Yanıtlanıyor: <span id="replyMessageText" style="font-weight: bold;"></span></span>
      <button onclick="window.cancelReply()">X</button>
    </div>
    <div id="messageInputContainer">
      <input type="text" id="messageInput" placeholder="Mesaj yaz...">
      <button id="sendButton" onclick="window.sendMessage()">Gönder</button>
    </div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, update, get, onChildChanged, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvpbHNav4d-TlmVx7SVbMUlolggv1JpIc",
      authDomain: "grupsohbet-3a1ba.firebaseapp.com",
      databaseURL: "https://grupsohbet-3a1ba-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "grupsohbet-3a1ba",
      storageBucket: "grupsohbet-3a1ba.firebasestorage.app",
      messagingSenderId: "316585268529",
      appId: "1:316585268529:web:036fe0d9660f2f0a89cc10"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');
    const typingRef = ref(db, 'typing');

    const userPasswords = {
      "Baran": "baran1313",
      "Miraç": ""
      // Daha fazla kullanıcı eklenebilir
    };

    let currentUser = "";
    let replyingToMessageId = null;
    let replyingToMessageText = "";
    let replyingToMessageUser = "";
    const messageElements = {};
    let typingTimeout = null;

    window.showScreen = function(screenId) {
      document.querySelectorAll('.screen-container').forEach(screen => {
        screen.classList.remove('visible');
      });
      document.getElementById(screenId).classList.add('visible');
      if (screenId === 'chat') {
        setTimeout(() => {
          const chatBox = document.getElementById("chatBox");
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 100);
      }
    };

    window.checkMainPassword = function() {
      const pass = document.getElementById("mainPassword").value;
      if (pass === "10aekibi") {
        window.showScreen("user-login");
      } else {
        alert("Yanlış şifre.");
      }
    };

    window.checkUserLogin = function() {
      const user = document.getElementById("userSelect").value;
      const pass = document.getElementById("userPassword").value;

      if (userPasswords[user] === pass) {
        currentUser = user;
        window.showScreen("chat");
        listenForMessages();
        setupTypingIndicator();
      } else {
        alert("Şifre yanlış!");
      }
    };

    window.sendMessage = function() {
      const messageInput = document.getElementById("messageInput");
      const messageText = messageInput.value.trim();
      if (!messageText) return;

      const messageData = {
        user: currentUser,
        text: messageText,
        time: Date.now(),
        replyTo: replyingToMessageId ? {
          id: replyingToMessageId,
          text: replyingToMessageText,
          user: replyingToMessageUser
        } : null
      };

      push(messagesRef, messageData).then(() => {
        messageInput.value = "";
        window.cancelReply();
        stopTyping(); // Mesaj gönderildiğinde yazma durumunu sıfırla
        const chatBox = document.getElementById("chatBox");
        setTimeout(() => {
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 100);
      }).catch(error => {
        console.error("Mesaj gönderme hatası:", error);
        alert("Mesaj gönderilemedi!");
      });
    };

    window.cancelReply = function() {
      replyingToMessageId = null;
      replyingToMessageText = "";
      replyingToMessageUser = "";
      document.getElementById("replyingTo").style.display = "none";
      document.getElementById("replyMessageText").textContent = "";
    };

    window.reactToMessage = async function(messageId, emoji) {
      const reactionPath = `messages/${messageId}/reactions/${emoji}`;
      const reactionRef = ref(db, reactionPath);

      try {
        const snapshot = await get(reactionRef);
        let usersReacted = snapshot.val() || {};
        if (usersReacted[currentUser]) {
          usersReacted[currentUser] = null;
        } else {
          usersReacted[currentUser] = true;
        }
        await update(ref(db), { [reactionPath]: usersReacted });
      } catch (error) {
        console.error("Tepki güncelleme hatası:", error);
      }
    };

    function startTyping() {
      const userTypingRef = ref(db, `typing/${currentUser}`);
      set(userTypingRef, { timestamp: Date.now() }).catch(error => {
        console.error("Yazma durumu güncelleme hatası:", error);
      });

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        stopTyping();
      }, 2000); // 2 saniye hareketsiz kalırsa yazma durumunu sil
    }

    function stopTyping() {
      const userTypingRef = ref(db, `typing/${currentUser}`);
      remove(userTypingRef).catch(error => {
        console.error("Yazma durumu silme hatası:", error);
      });
      clearTimeout(typingTimeout);
    }

    function setupTypingIndicator() {
      const messageInput = document.getElementById("messageInput");
      messageInput.addEventListener('input', () => {
        startTyping();
      });

      onValue(typingRef, (snapshot) => {
        const typingUsers = snapshot.val() || {};
        const activeUsers = Object.keys(typingUsers).filter(user => {
          const timestamp = typingUsers[user]?.timestamp;
          return timestamp && (Date.now() - timestamp < 3000); // 3 saniye içinde aktif olanlar
        }).filter(user => user !== currentUser); // Kendi adını hariç tut

        const typingIndicator = document.getElementById("typingIndicator");
        if (activeUsers.length === 0) {
          typingIndicator.classList.remove('visible');
          typingIndicator.textContent = '';
          return;
        }

        let displayText;
        if (activeUsers.length >= 6) {
          displayText = activeUsers.map(user => user[0]).join(', ') + ' yazıyor...';
        } else {
          displayText = activeUsers.join(', ') + ' yazıyor...';
        }

        typingIndicator.textContent = displayText;
        typingIndicator.classList.add('visible');
      });
    }

    function hideEmojiPicker() {
      document.querySelectorAll('.emoji-picker-container').forEach(picker => {
        picker.classList.remove('visible');
      });
    }

    function hideTimestamp(messageWrapper) {
      messageWrapper.classList.remove('show-time');
    }

    function updateReactions(messageId, reactions) {
      const reactionsDiv = messageElements[messageId]?.reactionsDiv;
      if (!reactionsDiv) return;

      reactionsDiv.innerHTML = "";
      if (reactions) {
        Object.entries(reactions).forEach(([emoji, users]) => {
          const validUsers = Object.keys(users || {}).filter(user => users[user]);
          if (validUsers.length > 0) {
            const reactionSpan = document.createElement("span");
            reactionSpan.textContent = `${emoji} `;
            const countSpan = document.createElement("small");
            countSpan.textContent = validUsers.length;
            reactionSpan.appendChild(countSpan);
            if (validUsers.includes(currentUser)) {
              reactionSpan.classList.add("user-reacted");
            }
            reactionsDiv.appendChild(reactionSpan);
          }
        });
      }
    }

    function listenForMessages() {
      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";

      onChildAdded(messagesRef, (snapshot) => {
        const msg = snapshot.val();
        const messageId = snapshot.key;
        displayMessage(msg, messageId);
        updateReactions(messageId, msg.reactions);
        setTimeout(() => {
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 100);
      });

      onChildChanged(messagesRef, (snapshot) => {
        const msg = snapshot.val();
        const messageId = snapshot.key;
        updateReactions(messageId, msg.reactions);
      });
    }

    function displayMessage(msg, messageId) {
      const chatBox = document.getElementById("chatBox");
      const messageWrapper = document.createElement("div");
      messageWrapper.classList.add("message-wrapper");
      messageWrapper.dataset.messageId = messageId;
      messageWrapper.classList.add(msg.user === currentUser ? "right" : "left");

      if (msg.replyTo) {
        const replyContext = document.createElement("div");
        replyContext.classList.add("reply-context");
        replyContext.innerHTML = `<strong>${msg.replyTo.user}</strong>: ${msg.replyTo.text}`;
        messageWrapper.appendChild(replyContext);
      }

      const messageDiv = document.createElement("div");
      messageDiv.classList.add("message", msg.user === currentUser ? "right" : "left");
      messageDiv.textContent = msg.text;

      const messageInfo = document.createElement("div");
      messageInfo.classList.add("message-info");
      const date = new Date(msg.time);
      messageInfo.textContent = date.toLocaleString('tr-TR', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
      messageWrapper.appendChild(messageDiv);
      messageWrapper.appendChild(messageInfo);

      const emojiPickerContainer = document.createElement('div');
      emojiPickerContainer.classList.add('emoji-picker-container');
      emojiPickerContainer.innerHTML = `
        <button data-emoji="❤️">❤️</button>
        <button data-emoji="😂">😂</button>
        <button data-emoji="😢">😢</button>
        <button data-emoji="😡">😡</button>
        <button data-emoji="👍">👍</button>
        <button data-emoji="😊">😊</button>
        <button data-emoji="🎉">🎉</button>
        <button data-emoji-other="true">🎨</button>
      `;
      messageWrapper.appendChild(emojiPickerContainer);

      const reactionsDiv = document.createElement("div");
      reactionsDiv.classList.add("message-reactions");
      messageWrapper.appendChild(reactionsDiv);

      emojiPickerContainer.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetEmoji = button.dataset.emoji;
          if (targetEmoji) {
            window.reactToMessage(messageId, targetEmoji);
          } else if (button.dataset.emojiOther) {
            const tempInput = document.createElement('input');
            tempInput.type = 'text';
            tempInput.style.position = 'absolute';
            tempInput.style.left = '-9999px';
            document.body.appendChild(tempInput);
            tempInput.focus();
            if (navigator.userAgent.match(/iPad|iPhone|iPod|Android/i)) {
              tempInput.setAttribute('type', 'text');
              tempInput.focus();
            }
            tempInput.addEventListener('input', () => {
              const selectedEmoji = tempInput.value.trim();
              if (selectedEmoji) {
                window.reactToMessage(messageId, selectedEmoji);
                tempInput.value = '';
              }
              if (tempInput.parentNode) {
                document.body.removeChild(tempInput);
              }
            });
            tempInput.addEventListener('blur', () => {
              if (tempInput.parentNode) {
                document.body.removeChild(tempInput);
              }
            });
            if (navigator.userAgent.match(/iPad|iPhone|iPod/i)) {
              const range = document.createRange();
              range.selectNodeContents(tempInput);
              const selection = window.getSelection();
              selection.removeAllRanges();
              selection.addRange(range);
            }
          }
          hideEmojiPicker();
        });
      });

      let startX;
      let isMoving = false;
      messageWrapper.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isMoving = false;
      });
      messageWrapper.addEventListener('touchmove', (e) => {
        isMoving = true;
        const currentX = e.touches[0].clientX;
        const deltaX = currentX - startX;
        const translateX = Math.max(-50, Math.min(50, deltaX));
        messageWrapper.style.transform = `translateX(${translateX}px)`;
      });
      messageWrapper.addEventListener('touchend', (e) => {
        messageWrapper.style.transform = 'translateX(0)';
        if (!isMoving) {
          messageWrapper.classList.toggle('show-time');
          hideEmojiPicker();
          emojiPickerContainer.classList.toggle('visible');
          if (messageWrapper.classList.contains('show-time')) {
            setTimeout(() => hideTimestamp(messageWrapper), 2000);
          }
          return;
        }
        const endX = e.changedTouches[0].clientX;
        const deltaX = endX - startX;
        if (Math.abs(deltaX) > 50) {
          if (deltaX > 0) {
            replyingToMessageId = messageId;
            replyingToMessageText = msg.text;
            replyingToMessageUser = msg.user;
            const replyText = document.getElementById("replyMessageText");
            replyText.textContent = `${msg.user}: ${msg.text}`;
            document.getElementById("replyingTo").style.display = "flex";
            document.getElementById("messageInput").focus();
          } else {
            messageWrapper.classList.add('show-time');
            hideEmojiPicker();
            setTimeout(() => hideTimestamp(messageWrapper), 2000);
          }
        }
      });

      messageWrapper.addEventListener('click', () => {
        messageWrapper.classList.toggle('show-time');
        hideEmojiPicker();
        emojiPickerContainer.classList.toggle('visible');
        if (messageWrapper.classList.contains('show-time')) {
          setTimeout(() => hideTimestamp(messageWrapper), 2000);
        }
      });

      chatBox.appendChild(messageWrapper);
      messageElements[messageId] = { wrapper: messageWrapper, reactionsDiv };
      setTimeout(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 100);
    }

    document.getElementById("messageInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        window.sendMessage();
      }
    });
  </script>
